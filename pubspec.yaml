name: lost_and_found
description: "Lost & Found App — Production-grade Android app for reporting lost items."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  # Authentication
  google_sign_in: ^6.2.1

  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.0
  firebase_messaging: ^14.7.0
  firebase_crashlytics: ^3.4.8
  firebase_analytics: ^10.8.0

  # Functional error handling
  fpdart: ^1.1.0

  # Utilities
  uuid: ^4.3.3
  qr_flutter: ^4.1.0          # QR code for tracking ID
  mobile_scanner: ^5.1.0      # QR scanner (admin side)
  intl: ^0.19.0               # Date formatting, l10n

  # UI/UX
  lottie: ^3.1.0              # Empty state animations
  shimmer: ^3.0.0             # Loading skeletons
  dynamic_color: ^1.7.0       # Material You theming
  google_fonts: ^6.2.1        # Plus Jakarta Sans

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # fonts:
  #   - family: PlusJakartaSans
  #     fonts:
  #       - asset: assets/fonts/PlusJakartaSans-Regular.ttf
  #       - asset: assets/fonts/PlusJakartaSans-Bold.ttf
  #         weight: 700
